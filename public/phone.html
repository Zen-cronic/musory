<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { padding: 16px; max-width: 480px; margin: 0 auto; }
  button { width: 100%; margin: 6px 0; font-size: 18px; padding: 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #like { font-size: 26px; padding: 22px; }
  #now-title { font-size: 34px; margin: 4px 0; }
  #venue-name { font-size: 28px; margin: 0; }
  section { margin: 14px 0; }
  #forget-big { font-size: 34px; padding: 34px; }
  #receipt .count { font-size: 64px; font-weight: 900; color: var(--band); font-family: var(--mono); }
  .tap { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .tap button { width: auto; margin: 0; padding: 4px 8px; font-size: 12px; }
  label { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--band); }
</style>
</head>
<body>
<header class="row" style="display:flex;justify-content:space-between;align-items:center">
  <div><div class="label">Musory</div><h1 id="venue-name" class="big">…</h1></div>
  <div id="guest-label" class="mono mute"></div>
</header>

<section id="consent" class="card hidden">
  <div class="label">Check in</div>
  <h2 id="consent-venue" class="big" style="font-size:28px">…</h2>
  <label><input type="checkbox" id="scope-taste" checked><span><b>Use my taste here while I'm checked in.</b><br><span class="mute">Your likes travel with you. This venue uses them only while you're here, and keeps no copy.</span></span></label>
  <label><input type="checkbox" id="scope-crowd" checked><span><b>Add my taps to this venue's crowd memory.</b><br><span class="mute">Kept only as part of a group of 3 or more people, with no name or id.</span></span></label>
  <button id="checkin" class="primary">Check in</button>
</section>

<section id="main" class="hidden">
  <div class="card">
    <div class="label">Now playing</div>
    <h2 id="now-title" class="big" data-track-id="">…</h2>
    <div id="now-meta" class="mono mute"></div>
    <div class="progress" style="margin-top:10px"><div id="now-progress"></div></div>
  </div>
  <button id="like" class="primary">I like this</button>
  <div class="two">
    <button id="skip">Not for me</button>
    <button id="bored">Bored of this</button>
  </div>
  <button id="undo" class="hidden">Undo "bored"</button>
  <div class="card" style="margin-top:8px">
    <div class="label">Start your taste: tap the sounds you like</div>
    <div id="samples" class="two"></div>
  </div>
  <div class="card" style="margin-top:8px">
    <div class="label">Tonight only</div>
    <div id="tonight-state" class="mute">Your taps go into your long-term taste.</div>
    <button id="tonight">Try something different tonight (here only)</button>
  </div>
  <section class="card">
    <div class="label">Your taste <span id="taste-version" class="mono"></span></div>
    <div id="taste" class="bars"></div>
    <div id="carry" class="mute" style="margin-top:6px"></div>
    <button id="switch-venue">Go to the other venue</button>
  </section>
  <section class="card">
    <div class="label">Your taps</div>
    <div id="taps"></div>
  </section>
  <section>
    <button id="forget" class="band">Forget me</button>
    <div id="forget-confirm" class="card hidden">
      <b>Delete your taste, your taps and your share of every venue's crowd memory?</b>
      <button id="forget-yes" class="band">Yes, forget me</button>
      <button id="forget-no">Cancel</button>
    </div>
  </section>
  <button id="checkout">Check out</button>
</section>

<section id="volunteer" class="hidden">
  <div class="label">You were picked</div>
  <button id="forget-big" class="band big">Forget me</button>
</section>

<section id="receipt" class="card hidden"></section>
<script type="module" src="/js/phone.js"></script>
</body>
</html>
