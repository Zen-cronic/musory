<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database rules, Musory</title>
<script src="/js/look-early.js"></script>
<link rel="stylesheet" href="/css/musory.css">
<style> body { padding: 24px; max-width: 1100px; margin: 0 auto; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; } button { width: 100%; text-align: left; } </style>
</head>
<body class="legacy">
<div class="label">Musory</div>
<h1 class="big" style="font-size:44px">What the database enforces</h1>
<div class="card"><div class="label">The number (recomputed now)</div><div id="number" class="mono" style="font-size:18px">…</div><button id="number-refresh" style="width:auto">Recompute</button></div>
<div class="grid" style="margin-top:16px">
  <div class="card"><button data-proof="cross-venue">Pulse Club's login reads Copper Bar's crowd memory</button><div class="mute">Expected: 13 Unauthorized</div><div class="result" id="out-cross-venue"></div></div>
  <div class="card"><button data-proof="own-venue">Copper Bar's login reads its own crowd memory</button><div class="mute">Expected: allowed</div><div class="result" id="out-own-venue"></div></div>
  <div class="card"><button data-proof="venue-reads-taps">Copper Bar's login reads guests' raw taps</button><div class="mute">Expected: 13 Unauthorized</div><div class="result" id="out-venue-reads-taps"></div></div>
  <div class="card"><button data-proof="crowd-under-3">Save a crowd memory built from 2 people</button><div class="mute">Expected: 121 (needs 3+)</div><div class="result" id="out-crowd-under-3"></div></div>
  <div class="card"><button data-proof="others-taps">Build one guest's taste from another guest's taps</button><div class="mute">Expected: 121</div><div class="result" id="out-others-taps"></div></div>
  <div class="card"><button data-proof="identity-in-venue">Write a guest id into venue memory</button><div class="mute">Expected: 121</div><div class="result" id="out-identity-in-venue"></div></div>
  <div class="card"><button data-proof="tonight-leak">Save a tonight-only tap into long-term taste</button><div class="mute">Expected: 121 (unless the guest kept it)</div><div class="result" id="out-tonight-leak"></div></div>
  <div class="card"><button data-proof="double-tap">One guest likes the same play twice</button><div class="mute">Expected: E11000, "already counted"</div><div class="result" id="out-double-tap"></div></div>
</div>
<div class="row" style="margin-top:16px;display:flex;gap:12px"><button id="reset" style="width:auto">Reset the rooms</button><a href="/start">Start here</a></div>
<script type="module">
import { api, $, refusalTicket } from "/js/common.js";
async function number() { const n = await api("/api/number"); $("number").textContent = n.sentence; }
document.querySelectorAll("[data-proof]").forEach((b) => (b.onclick = async () => {
  const out = $(`out-${b.dataset.proof}`);
  out.textContent = "…";
  try { const r = await api(`/api/proof/${b.dataset.proof}`, {}); const code = r.code ?? r.error?.code ?? r.refusal?.code; out.innerHTML = code != null ? refusalTicket({ code, reason: r.reason || r.message || r.error?.message || "The database refused it." }) : `<b>Allowed.</b> ${r.summary || r.message || ""}`; }
  catch (e) { const c = e.body?.error?.code ?? e.body?.code; out.innerHTML = c != null ? refusalTicket({ code: c, reason: e.message }) : e.message; }
}));
$("number-refresh").onclick = number;
$("reset").onclick = async () => { await api("/api/reset", {}); number(); };
number();
</script>
</body>
</html>
